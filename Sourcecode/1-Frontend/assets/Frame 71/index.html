
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Seller - shop.in</title>

    <link rel="stylesheet" href="index.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="dashboard">

        
        <div class="background"></div>

        
        <div class="header">
            <span class="back-arrow">←</span>
            <div class="dashboard-title">Dashboard</div>
        </div>

        
        <div class="main-panel"></div>

        
        <div class="store-card">
            <img src="icons/profile (2).svg" alt="Foto Toko" class="profile-icon">

            <div class="store-info">
                <div class="store-name">Toko Mimau.id</div>
                <div class="store-status">Toko Aktif</div>
            </div>
        </div>

        
        <div class="stat-card product-card">
            <div class="card-title">Produk</div>
            <div class="card-number">32</div>
        </div>

        
        <div class="stat-card order-card">
            <div class="card-title">Pesanan</div>
            <div class="card-number">48</div>
        </div>

        
        <div class="stat-card stock-card">
            <div class="card-title">Stok Menipis</div>
            <div class="card-number">5</div>
        </div>

        
        <div class="stat-card delivery-card">
            <div class="card-title">Paket Dikirim</div>
            <div class="card-number">15</div>
        </div>

        
        <div class="menu-card manage-card">
            <img src="icons/rumah.svg" alt="Kelola Produk">
            <div>Kelola Produk</div>
        </div>

        
        <div class="menu-card orders-menu-card">
            <img src="icons/keranjang (2).svg" alt="Pesanan">
            <div>Pesanan</div>
        </div>

        
        <div class="menu-card shipping-card">
            <img src="icons/truck.svg" alt="Pengiriman">
            <div>Pengiriman</div>
        </div>

        
        <div class="menu-card settings-card">
            <img src="icons/setting.svg" alt="Pengaturan">
            <div>Pengaturan</div>
        </div>

    </div>

</body>
</html>
