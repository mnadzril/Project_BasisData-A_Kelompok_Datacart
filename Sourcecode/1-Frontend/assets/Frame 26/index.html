
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - shop.in</title>

    <link rel="stylesheet" href="index.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="group-parent">

        <div class="background"></div>

        <button type="button" class="kembali-pembeli" id="kembaliKePembeli"
                title="Kembali ke akun pembeli" aria-label="Kembali ke akun pembeli">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
        </button>

        <div class="logo">
            <img src="icons/logo.svg" alt="Logo shop.in" class="logo-shop-icon">
        </div>

        <div class="admin">ADMIN</div>

        <div class="username">
            <img src="icons/Profile (1).svg" alt="Profile" class="profile-icon">
            <input type="text" placeholder="Username">
        </div>

        <div class="password">
            <img src="icons/gembok.svg" alt="Password" class="gembok-icon">
            <input type="password" placeholder="Password">
        </div>

        <button class="login">LOGIN</button>

        <div class="lupa-password" id="lupaPasswordText">
            Lupa Password?
        </div>

        <div class="login-seller" id="loginSeller" title="Masuk sebagai penjual">
            Login Seller?
        </div>

    </div>

    <div class="popup-overlay" id="popupLupaPassword">
        <div class="popup-lupa">
            <div class="popup-lupa-header">
                <b class="popup-lupa-judul">Lupa Password</b>
                <div class="popup-lupa-tutup" id="tutupPopupLupa" title="Tutup">&times;</div>
            </div>
            <div class="popup-lupa-isi">
                <label class="label-lupa">Email akun</label>
                <input type="text" id="inputEmailLupa" class="input-lupa"
                       placeholder="contoh: admin@nexora.id" autocomplete="off">
                <label class="label-lupa">Password baru (min. 6 karakter)</label>
                <input type="password" id="passwordBaruLupa" class="input-lupa"
                       placeholder="Password baru" autocomplete="new-password">
                <input type="password" id="passwordBaruLupa2" class="input-lupa"
                       placeholder="Ulangi password baru" autocomplete="new-password">
                <div class="pesan-lupa" id="pesanLupa"></div>
                <button type="button" class="tombol-lupa" id="aturUlangPassword">Atur Ulang Password</button>
                <div class="catatan-lupa">
                    Password di database tersimpan sebagai hash satu arah sehingga tidak
                    bisa dilihat kembali; lewat sini password akun diganti yang baru.
                    Berlaku untuk akun Admin/CS, penjual, maupun pembeli.
                </div>
            </div>
        </div>
    </div>

    <script src="../shared/api.js"></script>
    <script src="../shared/nav.js"></script>
    <script src="app.js"></script>
</body>
</html>
