<div id="frameContainer" class="popup-overlay">
    <div class="rectangle-root">
        <div class="frame-child"></div>
        <div class="frame-item"></div>

        <b class="beli-sekarang2">Beli Sekarang</b>

        <div class="rectangle-group">
            <div class="rectangle-div"></div>
            <b class="b">-</b>
            <div class="group-child2"></div>
            <b class="b2">1</b>
            <div class="group-child3"></div>
            <b class="b3">+</b>
        </div>

            <div class="titanium-gray">Titanium Gray</div>

            <div class="titanium-yellow">Titanium Yellow</div>
        </div>

        <div class="warna">Warna</div>
        <div class="frame-inner"></div>
        <b class="samsung-s24-ultra2">Samsung S24 Ultra</b>
        <img class="samsung-icon" src="icons/Samsungicon.svg" alt="">
        <img class="akar-iconscross" src="icons/silang.svg" alt="">
        <img class="line-icon" alt="">
        <img class="frame-child2" alt="">
    </div>
</div>
  	
<script>
    const popup = document.getElementById("frameContainer");
    const tombolBeli = document.getElementById("rectangle2");
    const teksBeli = document.querySelector(".beli-sekarang");
    const tombolTutup = document.querySelector(".akar-iconscross");

    // Membuka popup
    function bukaPopup() {
        popup.style.display = "flex";
    }

    tombolBeli.addEventListener("click", bukaPopup);
    teksBeli.addEventListener("click", bukaPopup);

    // Menutup popup lewat area luar
    popup.addEventListener("click", function(event) {
        if (event.target === popup) {
            popup.style.display = "none";
        }
    });

    // Menutup popup lewat tombol silang
    tombolTutup.addEventListener("click", function() {
        popup.style.display = "none";
    });

    // Menuju Frame 8 saat tombol bayar di popup diklik
    const tombolBayar = document.querySelector(".beli-sekarang2");

    tombolBayar.addEventListener("click", function() {
        window.location.href = "../Frame%208/index.html";
    });

    // Menuju Frame 7 saat tambah ke keranjang diklik
    const tombolKeranjang = document.querySelector(".tombolkeranjang");

    tombolKeranjang.addEventListener("click", function() {
        window.location.href = "../Frame%207/index.html";
    });
	// Tombol kembali ke halaman sebelumnya
var panahIcon = document.getElementById("panahIcon");

if (panahIcon) {
    panahIcon.addEventListener("click", function() {
        window.history.back();
    });
}
</script>
