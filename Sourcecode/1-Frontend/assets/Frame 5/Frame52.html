<div class="tombolkeranjang" id="tombolKeranjang">

</div>

  	</div>
  	
<div id="frame5aContainer" class="popup-overlay">
    <iframe src="Frame52a.html" class="popup-frame"></iframe>
</div>
  	
  	
<script>
    
    const panahIcon = document.getElementById("panahIcon");

    if (panahIcon) {
        panahIcon.addEventListener("click", function () {
            window.location.href = "../Frame%203/index.html";
        });
    }

    
    const loveIcon = document.getElementById("loveIcon");

    if (loveIcon) {
        loveIcon.addEventListener("click", function () {
            window.location.href = "../Frame%206/index.html";
        });
    }


const bukaPopupRTX = document.getElementById("bukaPopupRTX");
const popup = document.getElementById("frame5aContainer");

if (bukaPopupRTX && popup) {
    bukaPopupRTX.addEventListener("click", function () {
        popup.style.display = "flex";
    });
}


const tombolKeranjang = document.getElementById("tombolKeranjang");

if (tombolKeranjang) {
    tombolKeranjang.addEventListener("click", function () {
        window.location.href = "../Frame%207/index.html";
    });
}


if (popup) {
    popup.addEventListener("click", function (e) {
        if (e.target === popup) {
            popup.style.display = "none";
        }
    });
}


window.addEventListener("message", function (e) {
    if (e.data === "closeRTX" && popup) {
        popup.style.display = "none";
    }
});
</script>
            
</body>
