<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Produk - shop.in Seller</title>

    <link rel="stylesheet" href="index.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="halaman">

        <div class="background"></div>

        <div class="header">
            <span class="back-arrow">&#8592;</span>
            <div class="halaman-title" id="judulHalaman">Edit Produk</div>
        </div>
        <div class="tombol-ke-pembeli" id="tombolKePembeli" title="Keluar dari akun penjual, kembali ke akun pembeli">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            <span>Akun Pembeli</span>
        </div>


        <div class="main-panel">

            <div class="foto-card">
                <img src="icons/kotak.svg" alt="Foto Produk" class="foto-produk" id="fotoProduk">
                <div class="foto-hint" id="hintFoto">URL Foto Produk</div>
            </div>

            <div class="form-card">

                <div class="field">
                    <div class="field-label">Nama Produk</div>
                    <input type="text" class="field-input" id="inputNama" placeholder="Nama produk">
                </div>

                <div class="field">
                    <div class="field-label">Harga Produk</div>
                    <input type="text" class="field-input" id="inputHarga" placeholder="Contoh: 250000">
                </div>

                <div class="field">
                    <div class="field-label">Stok</div>
                    <div class="stok-baris">
                        <button class="stek-button" id="tombolKurang">&#8722;</button>
                        <input type="text" class="field-input stok-input" id="inputStok" value="1">
                        <button class="stek-button" id="tombolTambah">&#43;</button>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">Kategori</div>
                    <input type="text" class="field-input" id="inputKategori" placeholder="Elektronik">
                </div>

                <div class="field">
                    <div class="field-label">URL Foto</div>
                    <input type="text" class="field-input" id="inputFoto" placeholder="/Frame 3/icons/...">
                </div>

                <div class="field">
                    <div class="field-label">Deskripsi</div>
                    <textarea class="field-input field-deskripsi" id="inputDeskripsi" placeholder="Deskripsi produk"></textarea>
                </div>

                <button class="simpan-button" id="tombolSimpan">SIMPAN</button>

            </div>

        </div>

    </div>

    <script src="../shared/api.js"></script>
    <script src="../shared/nav.js"></script>
    <script src="app.js"></script>

</body>
</html>
