
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>shop.id - Login</title>

    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="KotakSign.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap">
</head>
<body>

    <div class="loginnnnnnnnn">

        <div class="loginnnnnnnnn-child"></div>

        <div class="login" id="login"></div>

        <input type="text" class="username" id="username"
            placeholder="Username" autocomplete="username">

        <input type="password" class="password" id="password"
            placeholder="Password" autocomplete="current-password">

        <b class="login2">LOGIN</b>

        <img class="vector-user-icon" src="icons/Vector_User.svg" alt="">
        <img class="vector-pw-icon" src="icons/Vector_PW.svg" alt="">

        <b class="sign-up" id="signUpText">Sign up</b>

        <b class="login-to-your">Login to your Account</b>
        <b class="dont-have-an">Don’t have an account?</b>

        <b class="lupa-password" id="lupaPasswordText">Lupa Password?</b>

        <div class="logo-shop-parent">
            <img class="logo-shop-icon" src="icons/Logo Shop.png" alt="">
            <img class="shopid-icon" src="icons/Shop.id.png" alt="">
        </div>

    </div>

    <div class="popup-overlay" id="popupLupaPassword">
        <div class="popup-lupa">
            <div class="popup-lupa-header">
                <b class="popup-lupa-judul">Lupa Password</b>
                <div class="popup-lupa-tutup" id="tutupPopupLupa" title="Tutup">&times;</div>
            </div>
            <div class="popup-lupa-isi">
                <label class="label-lupa">Email akun</label>
                <input type="text" id="inputEmailLupa" class="input-lupa"
                       placeholder="contoh: user10@gmail.com" autocomplete="off">
                <label class="label-lupa">Password baru (min. 6 karakter)</label>
                <input type="password" id="passwordBaruLupa" class="input-lupa"
                       placeholder="Password baru" autocomplete="new-password">
                <input type="password" id="passwordBaruLupa2" class="input-lupa"
                       placeholder="Ulangi password baru" autocomplete="new-password">
                <div class="pesan-lupa" id="pesanLupa"></div>
                <button type="button" class="tombol-lupa" id="aturUlangPassword">Atur Ulang Password</button>
                <div class="catatan-lupa">
                    Password di database tersimpan sebagai hash satu arah sehingga tidak bisa
                    dilihat kembali; lewat sini password akun diganti yang baru.
                </div>
            </div>
        </div>
    </div>


    <script src="../shared/api.js"></script>
    <script src="../shared/nav.js"></script>
    <script src="app.js"></script>
</body>
</html>
