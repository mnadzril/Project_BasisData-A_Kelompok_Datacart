<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>shop.id - Sign Up</title>

    <link rel="stylesheet" href="KotakSign.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap">
</head>
<body>

    <div class="sign-page">

        <div class="sign-page-child"></div>

        <div class="kotak-sign">

            <div class="kotak-sign-child"></div>

            <b class="sign-up2">Sign up</b>

            <div class="username-parent">
                <input type="text" class="username3" id="inputUsername" placeholder="Username" autocomplete="off">
                <img class="vector-icon2" src="icons/Vector_User.svg" alt="">
            </div>

            <input type="password" class="password3" id="inputPassword" placeholder="Password">
            <img class="vector-icon" src="icons/Vector_PW.svg" alt="">

            <input type="email" class="password5" id="inputEmail" placeholder="Email" autocomplete="off">
            <img class="group-email-icon" src="icons/Group_Email.svg" alt="">

            <div class="login3"></div>
            <b class="login4" id="tombolLogin">LOGIN</b>

            <div class="login-masuk" id="linkLogin">Sudah punya akun? Masuk</div>

        </div>

    </div>

    <script src="../shared/api.js"></script>
    <script src="../shared/nav.js"></script>
    <script src="app.js"></script>

</body>
</html>
