<script>
    function aturNavigasi(selector, url) {
        const elemen = document.querySelector(selector);

        if (elemen) {
            elemen.style.cursor = "pointer";
            elemen.addEventListener("click", function() {
                window.location.href = url;
            });
        }
    }

    // Home
    aturNavigasi(".material-symbolshome-outline-icon", "../Frame%202/index.html");
