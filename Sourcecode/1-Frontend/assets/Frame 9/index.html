<!DOCTYPE html>
<html>
<head>
  	<meta charset="utf-8">
  	<meta name="viewport" content="initial-scale=1, width=device-width">
  	
  	
    <title>shop.id - Pembayaran</title>
<link rel="stylesheet"  href="./index.css" />
  	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" />
  	
  	
  	
</head>
<body>
  	
  	<div class="frame-9-done">
    		<div class="frame-9-done-child">
    		</div>
    		<div class="rectangle-parent">
      			<div class="group-child">
      			</div>
      			<img class="akar-iconsradio-fill" src="icons/buletbiru.svg">
      			
      			<b class="qris">QRIS</b>
      			<div class="bayar-dengan-qr">Bayar dengan QR Code</div>
      			<img class="kodeqr-icon" src="icons/kodeQR.svg">
      			
    		</div>
    		<div class="metode-pembayaran-parent">
      			<b class="metode-pembayaran">Metode Pembayaran</b>
      			<div class="lihat-semua-parent">
        				<div class="lihat-semua">Lihat semua</div>
        				<img class="vector-icon" src="icons/panahkanan.svg">
        				
      			</div>
    		</div>
    		<div class="rectangle-group">
      			<div class="group-item">
      			</div>
      			<div class="group-inner">
      			</div>
      			<b class="e-wallet">E-Wallet</b>
      			<div class="ovo-gopay-dana">OVO, GoPay, DANA, ShopeePay</div>
      			<img class="akar-iconsradio" src="icons/bulet.svg">
      			
      			<img class="dompet-icon" src="icons/Dompet.svg">
      			
      			<img class="ovo-icon" src="icons/OVO.svg">
      			
      			<img class="shoppe-icon" src="icons/Shoppe.svg">
      			
      			<img class="dana-icon" src="icons/DANA.svg">
      			
      			<img class="gopay-icon" src="icons/GoPay.svg">
      			
    		</div>
    		<div class="rectangle-container">
      			<div class="group-item">
      			</div>
      			<img class="ovo-icon" src="icons/myBCA.svg">
      			
      			<img class="gopay-icon" src="icons/Mandiri.svg">
      			
      			<img class="shoppe-icon" src="icons/BRImo BRI.svg">
      			
      			<img class="dana-icon" src="icons/BNI Mobile Banking.svg">
      			
      			<div class="group-inner">
      			</div>
      			<b class="transfer-bank">Transfer Bank</b>
      			<img class="akar-iconsradio2" src="icons/bulet.svg">
      			
      			<div class="bca-mandiri-bri">BCA, Mandiri, BRI, BNI, dll</div>
      			<img class="bank-icon" src="icons/Bank.svg">
      			
    		</div>
    		<div class="group-div">
      			<div class="group-inner">
      			</div>
      			<b class="cod-bayar-di">COD (Bayar di Tempat)</b>
      			<img class="akar-iconsradio3" src="icons/bulet.svg">
      			
      			<div class="bayar-saat-pesanan">Bayar saat pesanan diterima</div>
      			<img class="uang-icon" src="icons/Uang.svg">
      			
    		</div>
    		<div class="rectangle-parent2">
      			<div class="group-inner">
      			</div>
      			<b class="bayar-tunai-di">Bayar Tunai di  Mitra/Agen</b>
      			<img class="akar-iconsradio4" src="icons/bulet.svg">
      			
      			<div class="alfamartalfamididandanindom">Alfamart/Alfamidi/DanDan/Indomaret, dll</div>
      			<img class="mitra-icon" src="icons/Mitra.svg">
      			
    		</div>
    		<img class="frame-9-done-item" src="icons/KotakRingkas.svg" id="rectangle1">
    		
    		<b class="lanjut-ke-ringkasan">Lanjut ke Ringkasan</b>
    		<div class="pembayaran-parent">
      			<b class="pembayaran">Pembayaran</b>
      			<img class="panah-icon" src="icons/Panah.svg" id="panahIcon">
      			
    		</div>
  	</div>
  	
<script>
	var rectangle1 = document.getElementById("rectangle1");
	  var tombolRingkasan = document.querySelector(".lanjut-ke-ringkasan");
	  
	  function keRingkasan() {
    window.location.href = "../Frame%2010/index.html";
}

if (rectangle1) {
    rectangle1.addEventListener("click", keRingkasan);
}

if (tombolRingkasan) {
    tombolRingkasan.addEventListener("click", keRingkasan);
}

var panahIcon = document.getElementById("panahIcon");

if (panahIcon) {
	panahIcon.addEventListener("click", function() {
		window.history.back();
    });
}
</script>


    <script src="../shared/api.js"></script>
    <script src="../shared/nav.js"></script>
    <script src="app.js"></script>
</body>
</html>
